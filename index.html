<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Appraisal — Mega Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
<script src="https://static.zohocdn.com/creator/widgets/version/1.0/widgetsdk-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --bg:#F4F6F8; --panel:#FFFFFF; --line:#D7DEE5;
    --navy:#1E4E8C; --amber:#B7791F; --red:#C0392B; --green:#1E8E5A;
    --text:#1F2937; --muted:#6B7A8F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  body{padding:24px 28px 100px; min-height:100vh;}
  .wrap{max-width:1150px; margin:0 auto;}
  h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .hidden{display:none !important;}
  input,textarea,select{
    background:#F9FAFB; border:1px solid var(--line); color:var(--text);
    font-family:'Inter',sans-serif; font-size:13px; padding:8px 10px; width:100%; outline:none;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--navy);}
  input:disabled,select:disabled{background:#EEF1F4; color:var(--muted); cursor:not-allowed;}
  textarea{resize:vertical; min-height:60px;}
  label{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); display:block; margin-bottom:4px;}
  .req{color:var(--red);}
  button{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.04em; text-transform:uppercase;
    background:transparent; border:1px solid var(--navy); color:var(--navy); padding:8px 14px; cursor:pointer;
  }
  button:hover{background:var(--navy); color:#FFFFFF;}
  button.danger{border-color:var(--red); color:var(--red);}
  button.danger:hover{background:var(--red); color:#FFFFFF;}
  button.solid{background:var(--navy); color:#FFFFFF;}
  button.small{padding:5px 10px; font-size:10px;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  button:disabled:hover{background:transparent; color:var(--navy);}
  button.solid:disabled:hover{background:var(--navy); color:#fff;}

  /* ===== LOGIN ===== */
  .login-wrap{max-width:440px; margin:50px auto 0;}
  .login-card{background:var(--panel); border:1px solid var(--line); border-top:3px solid var(--navy); padding:28px; box-shadow:0 1px 3px rgba(31,41,55,.06);}
  .login-card h2{font-size:20px; color:var(--navy); margin-bottom:6px;}
  .login-card p{font-size:13px; color:var(--muted); margin:0 0 18px; line-height:1.5;}
  .login-card input{font-size:15px; padding:11px 12px;}
  .login-card button{width:100%; margin-top:14px; padding:12px; font-size:12px;}
  .login-msg{font-size:12px; margin-top:12px; min-height:16px; line-height:1.45;}
  .login-msg.bad{color:var(--red);} .login-msg.ok{color:var(--green);}
  .logo-row{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .logo-row img{height:34px;}

  .who-bar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; background:#EAF1FA; border:1px solid var(--navy); padding:10px 14px; margin-bottom:16px; font-size:13px;}

  .titleblock{border:1px solid var(--line); background:var(--panel); padding:20px 24px; margin-bottom:20px; box-shadow:0 1px 3px rgba(31,41,55,.06); border-top:3px solid var(--navy);}
  .tb-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px;}
  .quarter-row{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;}
  .quarter-btn{padding:8px 16px; border:1px solid var(--line); color:var(--muted); cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:11px; background:#fff;}
  .quarter-btn.active{border-color:var(--navy); color:var(--navy); font-weight:600; background:#EAF1FA;}
  .readonly-box{background:#EEF1F4; padding:8px 10px; font-size:13px; border:1px solid var(--line); min-height:35px;}

  /* ===== AUTO SCORE BAR ===== */
  .score-bar{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:20px;}
  .score-tile{background:var(--panel); border:1px solid var(--line); padding:12px 14px;}
  .score-tile .k{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);}
  .score-tile .v{font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; margin-top:4px; color:var(--navy);}
  .score-tile .s{font-size:11px; color:var(--muted); margin-top:2px;}
  .score-tile.final{border-color:var(--navy); background:#EAF1FA;}

  .section{border:1px solid var(--line); background:var(--panel); padding:22px; margin-bottom:20px; box-shadow:0 1px 3px rgba(31,41,55,.05);}
  .section-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px; border-bottom:1px solid var(--line); padding-bottom:12px;}
  .section-head h2{font-size:17px; color:var(--navy);}
  .weight-badge{font-family:'IBM Plex Mono',monospace; font-size:11px; padding:3px 9px; border:1px solid var(--green); color:var(--green); background:#EAF7F0;}
  .note{font-size:11px; color:var(--muted); margin:-6px 0 14px;}

  .kra-block{border:1px dashed var(--line); padding:16px; margin-bottom:16px;}
  .kra-top{display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap;}
  .kra-top .fields{flex:1; min-width:260px; display:grid; grid-template-columns:2fr 2fr 1fr; gap:10px;}
  .kra-actions{display:flex; gap:6px; flex-shrink:0; margin-top:16px;}
  .goal-row{border-top:1px solid var(--line); padding-top:12px; margin-top:12px; display:grid; grid-template-columns:1fr; gap:10px; padding-left:14px; border-left:3px solid #EAF1FA;}
  .goal-row-header{display:flex; justify-content:space-between; align-items:center;}
  .goal-tag{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted);}
  .achievement-grid{display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:10px;}
  .attr-row{display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:10px; align-items:end; margin-bottom:10px;}
  .empty{color:var(--muted); font-size:13px;}

  .train-table{width:100%; border-collapse:collapse;}
  .train-table th{text-align:left; font-size:10px; text-transform:uppercase; color:var(--muted); padding:8px 6px; border-bottom:1px solid var(--line);}
  .train-table td{padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top;}

  .overall-options{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-top:8px;}
  .overall-opt{border:1px solid var(--line); padding:10px 12px; cursor:pointer; font-size:13px; text-align:center;}
  .overall-opt.selected{border-color:var(--navy); color:var(--navy); background:#EAF1FA; font-weight:600;}

  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px;}

  .footer-bar{position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid var(--line);
    padding:14px 28px; display:flex; justify-content:space-between; align-items:center; z-index:10;
    box-shadow:0 -2px 6px rgba(31,41,55,.06); gap:12px; flex-wrap:wrap;}
  .status{font-size:11px; color:var(--muted); font-family:'IBM Plex Mono',monospace;}
  .status.ok{color:var(--green);} .status.bad{color:var(--red);}

  .done-banner{border:1px solid var(--green); background:#EAF7F0; color:#145C3B; padding:14px 18px; margin-bottom:20px; font-size:14px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}

  /* ===== TABS / APPROVALS ===== */
  .tab-row{display:flex; gap:8px; margin-bottom:16px;}
  .tab-btn{padding:10px 18px; border:1px solid var(--line); background:var(--panel); color:var(--muted); cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:12px;}
  .tab-btn.active{border-color:var(--navy); color:var(--navy); font-weight:600; background:#EAF1FA;}
  .tab-badge{background:var(--red); color:#fff; font-size:10px; padding:1px 6px; border-radius:10px; margin-left:6px;}
  .approval-card{border:1px solid var(--line); background:var(--panel); padding:16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  .approval-card .meta{font-size:12px; color:var(--muted);}
  .role-tag{font-family:'IBM Plex Mono',monospace; font-size:10px; padding:2px 8px; border:1px solid var(--amber); color:var(--amber);}
  .approval-detail-block{border:1px dashed var(--line); padding:14px; margin-bottom:12px;}
  .approval-goal-row{display:grid; grid-template-columns:2fr 2fr 1fr 1fr; gap:10px; align-items:end; margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}

  @media(max-width:760px){
    body{padding:16px 16px 150px;}
    .two-col, .kra-top .fields, .achievement-grid, .attr-row, .approval-goal-row{grid-template-columns:1fr;}
    .footer-bar{padding:12px 16px;}
  }
  /* ===== STEP BANNER ===== */
  .step-banner{display:flex; gap:14px; align-items:center; background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--navy); padding:14px 18px; margin-bottom:20px; flex-wrap:wrap;}
  .step-banner .num{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; color:#fff; background:var(--navy); padding:4px 10px;}
  .step-banner.rating{border-left-color:var(--amber);} .step-banner.rating .num{background:var(--amber);}
  .step-banner.done{border-left-color:var(--green);} .step-banner.done .num{background:var(--green);}
  .step-banner .t{font-weight:600; font-size:15px;} .step-banner .d{font-size:12px; color:var(--muted); margin-top:2px;}
  .steps{display:flex; gap:6px; margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:10px;}
  .steps span{padding:3px 8px; border:1px solid var(--line); color:var(--muted);}
  .steps span.on{border-color:var(--navy); color:var(--navy); font-weight:600;}
  .ro{background:#EEF1F4; padding:8px 10px; font-size:13px; border:1px solid var(--line); min-height:35px; white-space:pre-wrap;}
  .rate-grid{display:grid; grid-template-columns:3fr 3fr 1fr 1.3fr; gap:10px; align-items:start;}
  .loading-box{padding:40px; text-align:center; color:var(--muted); font-size:13px;}
  @media(max-width:760px){ .rate-grid{grid-template-columns:1fr;} .steps{margin-left:0;} }
</style>
</head>
<body>

<!-- =================== EMAIL SIGN-IN =================== -->
<div class="login-wrap" id="loginView">
  <div class="login-card">
    <div class="logo-row"><img class="mega-logo" alt="MEGA"><div><b>Performance Appraisal</b><div style="font-size:11px;color:var(--muted)">Mega Engineering</div></div></div>
    <h2>Sign in</h2>
    <p>Enter your official email address — the one registered in the Mega employee list.</p>
    <label>Email address</label>
    <input id="loginEmail" type="email" autocomplete="email" placeholder="name@mega.tc" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="solid" id="loginBtn" onclick="doLogin()" disabled>Continue</button>
    <div class="login-msg" id="loginMsg">Connecting…</div>
  </div>
</div>

<!-- =================== APPRAISAL PAGE =================== -->
<div class="wrap hidden" id="appView">
  <div class="who-bar">
    <div>Signed in as <b id="whoName">—</b> · <span id="whoEmail" class="mono"></span></div>
    <button class="small" onclick="logout()">Sign out</button>
  </div>

  <div class="titleblock">
    <div class="logo-row" style="margin-bottom:14px;"><img class="mega-logo" alt="MEGA"><h2 style="font-size:18px;">Performance Appraisal Form</h2></div>
    <div class="tb-grid">
      <div><label>Employee</label><div class="readonly-box" id="empNameDisplay">—</div></div>
      <div><label>Department</label><div class="readonly-box" id="deptDisplay">—</div></div>
      <div><label>Name of Appraiser</label><input id="appraiserName" placeholder="e.g. Kunal Joshi" onchange="markUnsaved()"></div>
      <div><label>Year</label><select id="yearSelect" onchange="changePeriod()"></select></div>
    </div>
    <div class="quarter-row" id="quarterRow"></div>
  </div>

  <div id="stepBanner"></div>
  <div id="pageBody"></div>
</div>

<div class="footer-bar hidden" id="footerBar">
  <span class="status" id="statusText">—</span>
  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <button onclick="downloadPdf()">Download PDF</button>
    <button class="solid" id="mainBtn" onclick="mainAction()">Submit</button>
  </div>
</div>

<script>
"use strict";
/* ======================================================================
   MEGA ENGINEERING — PERFORMANCE APPRAISAL  (one Creator widget, one page)
   ----------------------------------------------------------------------
   Sign in with email (must exist in the employee report), then per quarter:
     STEP 1  first visit   → Set Targets: KRA + tasks (weightage automatic)
                             saved to KRA, Goal, Competency + Review(Status "Draft")
     STEP 2  second visit  → Self Rating only: achievement + self rating per
                             task, role-attribute rating, factors, learnings,
                             training, overall → Review Status "Submitted for Approval"
     DONE    later visits  → read-only + Download PDF
   Uses only your EXISTING forms/fields. No Deluge functions, no Custom API.
   ====================================================================== */

/* ============================ CONFIG ============================ */
const CONFIG = {
  EMPLOYEE_REPORTS: ["All_Employees", "Employ_to_Create_ticket_Report"],   // first one with data is used
  EMP_FIELDS: { name:"Employee_Name", email:"Email", department:"Department" },
  REPORTS: { kra:"KRA_Report", goal:"Goal_Report", competency:"Competency_Report", review:"Review_Report", training:"Training_Need_Report" },
  FORMS:   { kra:"KRA", goal:"Goal", competency:"Competency", review:"Review", training:"Training_Need" },
  STATUS:  { targetsSet:"Draft", selfRated:"Submitted for Approval" },     // existing Review.Status values
  KRA_SHARE: 80, ROLE_SHARE: 20,               // total 100; no role attributes → targets get 100
  RATING_PCT: { 5:100, 4:90, 3:75, 2:50, 1:25 },
  MATCH_CREATOR_LOGIN: true,                   // typed email must equal the signed-in Creator user
  PAGE_SIZE: 200, MAX_PAGES: 20
};
const RATING_LABELS = { 5:'5 - Outstanding', 4:'4 - Very Good', 3:'3 - Good', 2:'2 - Fair', 1:'1 - Poor' };
const QUARTERS = [{id:'Q1',label:'Q1: Apr–Jun'},{id:'Q2',label:'Q2: Jul–Sep'},{id:'Q3',label:'Q3: Oct–Dec'},{id:'Q4',label:'Q4: Jan–Mar'}];
const OVERALL_LABELS = ['Outstanding','Exceeds Expectations','Meets Expectations','Needs Improvement','Unacceptable'];

   "Performance Appraisal Form - Revised 3.1.2" (Word)
   Page 1: Logo · Quarter strip · Name/Dept/Appraiser · Rating legend

const PDF_DEV_DIGITS = ['०','१','२','३','४','५','६','७','८','९'];
const PDF_QUARTERS = [
  {id:'Q1', label:'Q1: April to June'},
  {id:'Q2', label:'Q2 : July to September'},
  {id:'Q3', label:'Q3 :October- December'},
  {id:'Q4', label:'Q4: January to March'}
];

function pdfEsc(s){ return (s===null||s===undefined?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pdfMultiline(s){ return pdfEsc(s).replace(/\n/g,'<br>'); }
function pdfDev(n){ return String(n).split('').map(d => /\d/.test(d) ? PDF_DEV_DIGITS[+d] : d).join(''); }
function pdfNum(v){ const n = parseFloat(v); return isNaN(n) ? null : n; }
function pdfFmt(n, dp){ if(n===null||n===undefined||isNaN(n)) return ''; const f = Number(n).toFixed(dp===undefined?1:dp); return f.replace(/\.0+$/,'').replace(/(\.\d*?)0+$/,'$1'); }
function pdfPlain(v){
  if(v===null||v===undefined) return '';
  if(typeof v === 'object') return v.display_value || v.zc_display_value || '';
  return String(v);
}

/* Rating (1–5) → percentage using the editable rating map */
function pdfRatingPct(model, rating){
  const r = parseInt(rating, 10);
  if(!r || !model.ratingMap || model.ratingMap[r] === undefined) return null;
  return parseFloat(model.ratingMap[r]) || 0;
}

/* Weighted average rating of a KRA's tasks (by task weightage; equal if none) */
function pdfKraAvgRating(kra, key){
  let sum = 0, wt = 0, cnt = 0;
  (kra.goals||[]).forEach(g => {
    const r = pdfNum(g[key]); if(r===null) return;
    const w = pdfNum(g.weightage) || 0;
    sum += r * (w > 0 ? w : 1); wt += (w > 0 ? w : 1); cnt++;
  });
  return cnt ? sum / wt : null;
}

/* KRA section score (out of KRA section weight) for 'selfRating' or 'apprRating' */
function pdfKraScore(model, key){
  let total = 0, any = false;
  (model.kras||[]).forEach(kra => {
    const kw = pdfNum(kra.weightage) || 0;
    if(!kw || !(kra.goals||[]).length) return;
    let ws = 0, wt = 0;
    kra.goals.forEach(g => {
      let r = g[key];
      if(key === 'apprRating' && (r===''||r===null||r===undefined)) return;
      const pct = pdfRatingPct(model, r); if(pct===null) return;
      const gw = pdfNum(g.weightage) || 1;
      ws += gw * pct; wt += gw; any = true;
    });
    if(wt > 0) total += kw * (ws / wt) / 100;
  });
  return any ? total : null;
}
function pdfAttrScore(model){
  let total = 0, any = false;
  (model.attributes||[]).forEach(a => {
    const pct = pdfRatingPct(model, a.rating); if(pct===null) return;
    total += (pdfNum(a.weightage)||0) * pct / 100; any = true;
  });
  return any ? total : null;
}

/* ---------- Page-1 target block ---------- */
function pdfTargetLabel(i){
  const n = i + 1;
  if(i < PDF_FIXED_TARGETS) return `Target-${n} (उद्दिष्ट ${pdfDev(n)} ) :`;
  if(i === PDF_FIXED_TARGETS) return `Additional Target ( If any) : (उद्दिष्ट ${pdfDev(n)}):`;
  return `Additional Target : (उद्दिष्ट ${pdfDev(n)}):`;
}
function pdfTargetBlock(kra, i){
  const n = i + 1;
  const label = pdfTargetLabel(i);
  const achLabel = `Achievement: (प्राप्ति ${pdfDev(n)})`;
  if(!kra || (!kra.name && !(kra.goals||[]).length)){
    return `<tr class="pa-avoid"><td class="pa-tcell"><div class="pa-b">${label}</div><div class="pa-blank"></div><div class="pa-b">${achLabel}</div><div class="pa-blank-s"></div></td><td></td><td></td></tr>`;
  }
  const selfAvg = pdfKraAvgRating(kra, 'selfRating');
  const apprAvg = pdfKraAvgRating(kra, 'apprRating');
  const kw = pdfNum(kra.weightage);
  let html = `<tr class="pa-avoid pa-target-row">
    <td class="pa-tcell">
      <div><span class="pa-b">${label}</span> <span class="pa-b">${pdfEsc(kra.name)}</span>${kw!==null?` <span class="pa-wt">(Weightage ${pdfFmt(kw,2)}%)</span>`:''}</div>
      ${kra.description ? `<div class="pa-desc">${pdfMultiline(kra.description)}</div>` : ''}
    </td>
    <td class="pa-rc pa-b">${selfAvg!==null?pdfFmt(selfAvg,1):''}</td>
    <td class="pa-rc pa-b">${apprAvg!==null?pdfFmt(apprAvg,1):''}</td>
  </tr>`;
  const goals = kra.goals || [];
  if(!goals.length){
    html += `<tr class="pa-avoid"><td class="pa-tcell pa-task"><div class="pa-b">${achLabel}</div><div class="pa-blank-s"></div></td><td></td><td></td></tr>`;
  }
  goals.forEach((g, gi) => {
    const gw = pdfNum(g.weightage);
    html += `<tr class="pa-avoid">
      <td class="pa-tcell pa-task">
        <div><span class="pa-tasktag">Task ${n}.${gi+1}${gw!==null?` · ${pdfFmt(gw,2)}%`:''}</span> ${pdfMultiline(g.name)}</div>
        <div class="pa-ach"><span class="pa-b">${achLabel}</span> ${pdfMultiline(g.achievement)}</div>
      </td>
      <td class="pa-rc">${pdfEsc(g.selfRating)}</td>
      <td class="pa-rc">${pdfEsc(g.apprRating)}</td>
    </tr>`;
  });
  return html;
}

function pdfSafeFileName(model){
  return ('Performance_Appraisal_' + (model.employeeName||'Employee') + '_' + (model.quarter||'') + '_' + (model.year||''))
    .replace(/[^A-Za-z0-9_\-]+/g,'_').replace(/_+/g,'_') + '.pdf';

/* Print-window fallback if html2pdf is unavailable / blocked */
function pdfPrintFallback(html){
  const w = window.open('', '_blank');
  if(!w){ return false; }
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Performance Appraisal</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
    <style>@page{size:A4;margin:10mm} body{margin:0} ${PDF_CSS} .pa-pdf{width:auto}</style></head><body>${html}
    <script>window.onload=function(){setTimeout(function(){window.print();},400);}<\/script></body></html>`);
  w.document.close();
  return true;
}

/* Main entry: build + download PDF. Returns a Promise. */
async function downloadAppraisalPdf(model, onStatus){
  const say = onStatus || function(){};
  const html = buildAppraisalPdfHtml(model);
  if(typeof html2pdf === 'undefined'){
    say('PDF library not loaded — opening print view (choose "Save as PDF").', null);
    if(!pdfPrintFallback(html)) say('Pop-up blocked. Allow pop-ups to print / save PDF.', false);
    return;
  }
  say('Generating PDF…', null);
  const holder = document.createElement('div');
  holder.style.cssText = 'position:absolute;left:0;top:0;width:718px;background:#fff;z-index:-1;pointer-events:none;';
  const prevScroll = [window.scrollX, window.scrollY]; window.scrollTo(0,0);
  holder.innerHTML = html;
  document.body.appendChild(holder);
  try{
    if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
    const imgs = Array.from(holder.querySelectorAll('img'));
    await Promise.all(imgs.map(im => im.complete ? 1 : new Promise(r => { im.onload = im.onerror = r; })));
    /* Render each form page separately so page 2 always starts on a fresh
       sheet (no blank pages), while long target lists flow onto extra pages
       without cutting a task row in half. */
    const pages = Array.from(holder.querySelectorAll('.pa-page')).map(pg => {
      const wrap = document.createElement('div');
      wrap.className = 'pa-pdf';
      const clone = pg.cloneNode(true);
      clone.classList.remove('pa-page2');
      wrap.appendChild(clone);
      holder.appendChild(wrap);
      return wrap;
    });
    holder.firstElementChild.style.display = 'none';
    const opt = {
      margin: [10, 10, 10, 10],
      filename: pdfSafeFileName(model),
      image: { type: 'jpeg', quality: 0.96 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0, x: 0, y: 0, windowWidth: 718 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css'], avoid: ['.pa-avoid'] }
    };
    /* 1) Each form page → canvas (html2pdf inserts "avoid" spacers so a
          task row is never cut across two sheets).
       2) Slice every canvas onto A4 sheets ourselves → page 2 of the form
          always starts on a new sheet and no blank pages are produced. */
    const canvases = [];
    for(const el of pages){
      canvases.push(await html2pdf().set(opt).from(el).toCanvas().get('canvas'));
    }
    const probe = document.createElement('div'); probe.style.cssText = 'width:10px;height:10px'; holder.appendChild(probe);
    // html2pdf does not expose jsPDF globally: take its instance (1 probe page) and drop that page at the end.
    const pdf = await html2pdf().set(opt).from(probe).toPdf().get('pdf');
    const M = 10, innerW = 210 - 2*M, innerH = 297 - 2*M;
    canvases.forEach(cv => {
      const pxPerPage = Math.floor(cv.width * innerH / innerW);
      for(let y = 0; y < cv.height; y += pxPerPage){
        const sliceH = Math.min(pxPerPage, cv.height - y);
        if(sliceH < 6) break;                         // ignore sub-pixel leftovers
        const sc = document.createElement('canvas');
        sc.width = cv.width; sc.height = sliceH;
        const ctx = sc.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, sc.width, sc.height);
        ctx.drawImage(cv, 0, y, cv.width, sliceH, 0, 0, cv.width, sliceH);
        pdf.addPage();
        pdf.addImage(sc.toDataURL('image/jpeg', 0.96), 'JPEG', M, M, innerW, sliceH * innerW / cv.width);
      }
    });
    pdf.deletePage(1);
    pdf.save(opt.filename);
    say('✅ PDF downloaded.', true);
  } catch(err){
    console.error('PDF ERROR', err);
    say('Direct download failed — opening print view (choose "Save as PDF").', false);
    pdfPrintFallback(html);
  } finally {
    document.body.removeChild(holder);
    window.scrollTo(prevScroll[0], prevScroll[1]);
  }
}

/* ======================= CREATOR API HELPERS ======================= */
async function getAll(reportName, criteria){
  const out = [];
  for(let page = 1; page <= CONFIG.MAX_PAGES; page++){
    const cfg = { reportName, page, pageSize:CONFIG.PAGE_SIZE };
    if(criteria) cfg.criteria = criteria;
    let resp;
    try{ resp = await ZOHO.CREATOR.API.getAllRecords(cfg); }
    catch(err){ if(page === 1 && !isEmptyErr(err)) throw err; break; }
    const rows = (resp && resp.data) ? resp.data : [];
    out.push(...rows);
    if(rows.length < CONFIG.PAGE_SIZE) break;
  }
  return out;
}
function isEmptyErr(err){ return /9220|No records|no data/i.test(JSON.stringify(err || '')); }
async function getAllSafe(r, c){ try{ return await getAll(r, c); }catch(e){ console.warn('read failed', r, e); return []; } }
function addRecord(formName, data){
  return ZOHO.CREATOR.API.addRecord({ formName, data:{ data } }).then(resp => { if(resp && resp.code === 3000) return resp.data; throw resp; });
}
function updateRecord(reportName, id, data){
  return ZOHO.CREATOR.API.updateRecord({ reportName, id, data:{ data } }).then(resp => { if(resp && resp.code === 3000) return resp.data; throw resp; });
}
function errText(err){
  if(!err) return 'unknown error';
  if(typeof err === 'string') return err;
  if(err.message) return err.message;
  if(err.error) return typeof err.error === 'string' ? err.error : JSON.stringify(err.error);
  try{ return JSON.stringify(err).slice(0, 220); }catch(e){ return String(err); }
}
function plain(v){ if(v === null || v === undefined) return ''; if(typeof v === 'object') return v.display_value || v.zc_display_value || ''; return String(v); }
function critStr(v){ return String(v || '').replace(/\\/g,'\\\\').replace(/"/g,'\\"'); }
function byId(a, b){ const x = String(a.ID), y = String(b.ID); return x.length - y.length || (x < y ? -1 : x > y ? 1 : 0); }

function empName(rec){
  const v = rec[CONFIG.EMP_FIELDS.name];
  if(!v) return '';
  if(typeof v === 'string') return v.trim();
  if(typeof v === 'object') return (v.display_value || v.zc_display_value || [v.prefix,v.first_name,v.last_name,v.suffix].filter(Boolean).join(' ')).trim();
  return String(v).trim();

async function loadEmployees(){
  let lastErr = null;
  for(const rep of CONFIG.EMPLOYEE_REPORTS){
    try{
      const list = (await getAll(rep)).map(r => ({
        ID:String(r.ID), name:empName(r),
        department:plain(r[CONFIG.EMP_FIELDS.department]).trim(),
        email:plain(r[CONFIG.EMP_FIELDS.email]).trim().toLowerCase()
      })).filter(e => e.name);
      if(list.length && list.some(e => e.email)){ state.employees = list; return; }
    }catch(err){ lastErr = err; console.warn('Employee report failed:', rep, err); }
  }
  throw lastErr || new Error('No employee report returned data');
}

  const emp = state.employees.find(e => e.email === mail);
  if(!emp){ loginMsg('This email is not in the Mega employee list. Use your official email or contact HR.', false); return; }
  if(CONFIG.MATCH_CREATOR_LOGIN && state.creatorUser && state.creatorUser !== mail){
    loginMsg('This email does not match the Creator account you are signed in with (' + state.creatorUser + ').', false); return;
  }
  state.me = emp;
  try{ sessionStorage.setItem('mega_pa_session', mail); }catch(e){}
  openApp();
}
function logout(){ saveDraft(); try{ sessionStorage.removeItem('mega_pa_session'); }catch(e){} location.reload(); }

/* ======================= PAGE + PERIOD ======================= */
function openApp(){

  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('footerBar').classList.remove('hidden');
  document.getElementById('whoName').textContent = state.me.name;

  document.getElementById('deptDisplay').textContent = state.me.department || '—';
  const y = new Date().getFullYear();
  document.getElementById('yearSelect').innerHTML = [y-1, y, y+1].map(v => `<option ${String(v)===state.year?'selected':''}>${v}</option>`).join('');
  renderQuarters();
  loadPeriod();
}
function renderQuarters(){
  document.getElementById('quarterRow').innerHTML = QUARTERS.map(q =>
    `<div class="quarter-btn ${state.quarter===q.id?'active':''}" onclick="setQuarter('${q.id}')">${q.label}</div>`).join('');
}
function setQuarter(q){ if(state.busy || q === state.quarter) return; saveDraft(); state.quarter = q; renderQuarters(); loadPeriod(); }
function changePeriod(){ if(state.busy) return; saveDraft(); state.year = document.getElementById('yearSelect').value; loadPeriod(); }

/* Decides which step to show for the selected quarter / year */
async function loadPeriod(){
  const token = ++state.loadToken;
  state.phase = 'loading'; resetData();
  document.getElementById('appraiserName').value = '';
  renderPage();
  setStatus('Loading your ' + state.quarter + ' ' + state.year + ' appraisal…', null);
  const me = state.me, q = state.quarter, y = state.year;
  const [reviews, kraRecs] = await Promise.all([
    getAllSafe(CONFIG.REPORTS.review, `(Employee_Lookup == ${me.ID} && Quarter == "${q}" && Year_field == "${y}")`),
    getAllSafe(CONFIG.REPORTS.kra, `(Employee_Name == "${critStr(me.name)}" && Quarter == "${q}" && Year_field1 == "${y}")`)
  ]);
  if(token !== state.loadToken) return;                 // user switched period meanwhile

  if(!reviews.length && !kraRecs.length){
    state.phase = 'targets';
    if(!restoreDraft()) addKRA(true);
  } else {
    state.review = reviews.length ? reviews.sort(byId)[0] : null;
    const [goalLists, comps, trains] = await Promise.all([
      Promise.all(kraRecs.sort(byId).map(k => getAllSafe(CONFIG.REPORTS.goal, `(KRA == ${k.ID})`))),
      getAllSafe(CONFIG.REPORTS.competency, `(Employee_Name1 == "${critStr(me.name)}" && Quarter == "${q}" && Year_field1 == "${y}")`),
      getAllSafe(CONFIG.REPORTS.training, `(Employee_Name == "${critStr(me.name)}" && Quarter1 == "${q}" && Year_field == "${y}")`)
    ]);
    if(token !== state.loadToken) return;
    state.kras = kraRecs.map((k, i) => ({
      id:nid('k'), recId:String(k.ID), name:plain(k.KRA_Name), description:plain(k.Description), weightage:parseFloat(plain(k.Weightage)) || 0,
      goals:goalLists[i].sort(byId).map(g => ({ id:nid('g'), recId:String(g.ID), name:plain(g.Goal_Name), achievement:plain(g.Achievement),
        weightage:parseFloat(plain(g.Weightage)) || 0, selfRating:plain(g.Self_Rating), apprRating:plain(g.Appraiser_Rating) }))
    }));
    state.attributes = comps.sort(byId).map(c => ({ id:nid('a'), recId:String(c.ID), name:plain(c.Attribute_Name), weightage:parseFloat(plain(c.Weightage)) || 0, rating:plain(c.Rating) }));
    const r = state.review || {};
    const status = plain(r.Status);
    state.phase = (state.review && status && status !== CONFIG.STATUS.targetsSet) ? 'done' : 'rating';
    document.getElementById('appraiserName').value = plain(r.Appraiser_Name);
    state.texts = { facFactors:plain(r.Facilitating_Factors1), conFactors:plain(r.Constraining_Factors), outAchieve:plain(r.Outstanding_Achievement),
                    apprComments:plain(r.Appraiser_Comments), myLearnings:plain(r.My_Learnings) };
    state.overallRating = plain(r.Overall_Rating);
    state.training = trains.sort(byId).map(t => ({ id:nid('t'), recId:String(t.ID), need:plain(t.Training_Need), benefit:plain(t.Expected_Benefit), fulfilled:plain(t.How_Fulfilled) }));
    if(state.phase === 'rating') restoreDraft();
  }
  renderPage();
  const msg = { targets:'Step 1 — add your Targets (KRA) and tasks, then click Submit Targets.',
                rating:'Step 2 — fill achievement and self rating for each task, then click Submit Self Rating.',
                done:'This appraisal is complete. You can download the PDF.' }[state.phase];
  setStatus(msg, true);
}
function resetData(){
  state.review = null; state.kras = []; state.attributes = []; state.training = []; state.overallRating = '';
  state.texts = { facFactors:'', conFactors:'', outAchieve:'', apprComments:'', myLearnings:'' };
}

/* ======================= AUTO WEIGHTAGE ======================= */
function splitEven(total, count){
  if(count <= 0) return [];
  const each = Math.floor((total / count) * 100) / 100;
  const arr = new Array(count).fill(each);
  arr[count-1] = Math.round((total - each * (count-1)) * 100) / 100;
  return arr;
}
function sectionShares(){ const r = state.attributes.length > 0; return { kra: r ? CONFIG.KRA_SHARE : 100, role: r ? CONFIG.ROLE_SHARE : 0 }; }
/* Only in Step 1 — later the saved weights are used as they are */
function applyWeights(){
  if(state.phase !== 'targets') return;
  const sh = sectionShares(), kw = splitEven(sh.kra, state.kras.length);
  state.kras.forEach((k, i) => { k.weightage = kw[i]; const gw = splitEven(k.weightage, k.goals.length); k.goals.forEach((g, j) => g.weightage = gw[j]); });
  const aw = splitEven(sh.role, state.attributes.length);
  state.attributes.forEach((a, i) => a.weightage = aw[i]);
}
function pct(r){ const n = parseInt(r, 10); return CONFIG.RATING_PCT[n] !== undefined ? CONFIG.RATING_PCT[n] : 0; }
function computeScores(){
  let kra = 0, role = 0;
  state.kras.forEach(k => k.goals.forEach(g => { kra += (g.weightage || 0) * pct(g.selfRating) / 100; }));
  state.attributes.forEach(a => { role += (a.weightage || 0) * pct(a.rating) / 100; });
  kra = Math.round(kra*100)/100; role = Math.round(role*100)/100;
  return { kra, role, total: Math.round((kra + role)*100)/100 };
}
function suggestedOverall(s){ return s >= 96 ? 'Outstanding' : s >= 86 ? 'Exceeds Expectations' : s >= 71 ? 'Meets Expectations' : s >= 50 ? 'Needs Improvement' : 'Unacceptable'; }
function kraTotal(){ return state.kras.reduce((s,k) => s + (k.weightage||0), 0); }
function roleTotal(){ return state.attributes.reduce((s,a) => s + (a.weightage||0), 0); }

/* ======================= STEP 1 EDITING ======================= */
function newGoal(){ return { id:nid('g'), recId:'', name:'', achievement:'', weightage:0, selfRating:'', apprRating:'' }; }
function addKRA(silent){ state.kras.push({ id:nid('k'), recId:'', name:'', description:'', weightage:0, goals:[newGoal()] }); if(!silent){ renderPage(); markUnsaved(); } }
function removeKRA(id){ state.kras = state.kras.filter(k => k.id !== id); renderPage(); markUnsaved(); }
function findKra(id){ return state.kras.find(k => k.id === id); }
function findGoal(kid, gid){ return findKra(kid).goals.find(g => g.id === gid); }
function addGoal(kid){ findKra(kid).goals.push(newGoal()); renderPage(); markUnsaved(); }
function removeGoal(kid, gid){ const k = findKra(kid); k.goals = k.goals.filter(g => g.id !== gid); renderPage(); markUnsaved(); }
function addAttribute(){ state.attributes.push({ id:nid('a'), recId:'', name:'', weightage:0, rating:'' }); renderPage(); markUnsaved(); }
function removeAttribute(id){ state.attributes = state.attributes.filter(a => a.id !== id); renderPage(); markUnsaved(); }
/* text edits never re-render (keeps the cursor where the user clicked) */
function setKra(id, f, v){ findKra(id)[f] = v; markUnsaved(); }
function setGoal(kid, gid, f, v){ findGoal(kid, gid)[f] = v; if(f === 'selfRating') renderScores(); markUnsaved(); }
function setAttr(id, f, v){ state.attributes.find(a => a.id === id)[f] = v; if(f === 'rating') renderScores(); markUnsaved(); }
function setText(id, v){ state.texts[id] = v; markUnsaved(); }

/* ======================= STEP 2 EXTRAS ======================= */
function addTrainingRow(){ state.training.push({ id:nid('t'), recId:'', need:'', benefit:'', fulfilled:'' }); renderPage(); markUnsaved(); }
function removeTrainingRow(id){ state.training = state.training.filter(t => t.id !== id); renderPage(); markUnsaved(); }

/* ======================= STATUS / DRAFT ======================= */
function setStatus(msg, ok){ const s = document.getElementById('statusText'); s.textContent = msg; s.classList.remove('ok','bad'); if(ok===true) s.classList.add('ok'); if(ok===false) s.classList.add('bad'); }
function draftKey(){ return `mega_pa::${state.me ? state.me.email : ''}::${state.quarter}::${state.year}::${state.phase}`; }
function markUnsaved(){ if(state.phase !== 'targets' && state.phase !== 'rating') return; saveDraft(); setStatus('Draft kept in this browser — remember to submit.', null); }
function saveDraft(){
  if(!state.me || (state.phase !== 'targets' && state.phase !== 'rating')) return;
  let d;
  if(state.phase === 'targets') d = { kras:state.kras, attributes:state.attributes, appraiser:val('appraiserName') };
  else d = {
    goals:Object.fromEntries(state.kras.flatMap(k => k.goals).map(g => [g.recId, { a:g.achievement, r:g.selfRating }])),
    attrs:Object.fromEntries(state.attributes.map(a => [a.recId, a.rating])),
    training:state.training, texts:state.texts, overall:state.overallRating, appraiser:val('appraiserName')
  };
  try{ localStorage.setItem(draftKey(), JSON.stringify(d)); }catch(e){}
}
function restoreDraft(){
  let d = null; try{ d = JSON.parse(localStorage.getItem(draftKey()) || 'null'); }catch(e){}
  if(!d) return false;
  if(state.phase === 'targets'){
    if(!Array.isArray(d.kras) || !d.kras.length) return false;
    state.kras = d.kras; state.attributes = d.attributes || [];
  } else {
    state.kras.forEach(k => k.goals.forEach(g => { const x = d.goals && d.goals[g.recId]; if(x){ if(x.a && !g.achievement) g.achievement = x.a; if(x.r && !g.selfRating) g.selfRating = x.r; } }));
    state.attributes.forEach(a => { const r = d.attrs && d.attrs[a.recId]; if(r && !a.rating) a.rating = r; });
    if(Array.isArray(d.training)){ const saved = state.training.filter(t => t.recId); state.training = saved.concat(d.training.filter(t => !t.recId)); }
    if(d.texts) Object.keys(state.texts).forEach(k => { if(!state.texts[k] && d.texts[k]) state.texts[k] = d.texts[k]; });
    if(d.overall && !state.overallRating) state.overallRating = d.overall;
  }
  const allIds = [...state.kras.flatMap(k => [k.id, ...k.goals.map(g => g.id)]), ...state.attributes.map(a => a.id), ...state.training.map(t => t.id)];
  seq = Math.max(seq, allIds.reduce((m, id) => Math.max(m, parseInt(String(id).slice(1)) || 0), 0) + 1);
  if(d.appraiser && !val('appraiserName')) document.getElementById('appraiserName').value = d.appraiser;
  return true;
}
function clearDraft(){ try{ localStorage.removeItem(draftKey()); }catch(e){} }
function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }

/* ======================= SUBMIT ======================= */
function mainAction(){ if(state.phase === 'targets') submitTargets(); else if(state.phase === 'rating') submitRating(); }
function lock(on){ state.busy = on; document.getElementById('mainBtn').disabled = on; }

function validateTargets(){
  if(!state.kras.length) return 'Add at least one Target (KRA).';
  for(let i = 0; i < state.kras.length; i++){
    const k = state.kras[i];
    if(!k.name.trim()) return `Target ${i+1}: enter the target name.`;
    if(!k.goals.length) return `Target ${i+1}: add at least one task.`;
    for(let j = 0; j < k.goals.length; j++) if(!k.goals[j].name.trim()) return `Task ${i+1}.${j+1}: describe the task (or remove it).`;
  }
  for(let i = 0; i < state.attributes.length; i++) if(!state.attributes[i].name.trim()) return `Role Attribute ${i+1}: enter the name (or remove it).`;
  return '';
}
/* STEP 1 → KRA, Goal, Competency records + Review (Status Draft).
   Records already created (recId set) are skipped on a retry. */
async function submitTargets(){
  if(state.busy) return;
  applyWeights();
  const problem = validateTargets(); if(problem){ setStatus('❌ ' + problem, false); return; }
  const me = state.me, q = state.quarter, y = state.year;
  lock(true);
  try{
    setStatus('Checking…', null);
    const already = await getAllSafe(CONFIG.REPORTS.review, `(Employee_Lookup == ${me.ID} && Quarter == "${q}" && Year_field == "${y}")`);
    if(already.length && !state.kras.some(k => k.recId)){ setStatus('Targets for ' + q + ' ' + y + ' are already saved — reloading.', null); lock(false); return loadPeriod(); }
    const total = state.kras.reduce((n,k) => n + 1 + k.goals.length, 0) + state.attributes.length + 1;
    let step = 0; const tick = w => setStatus(`Saving ${w}… (${++step}/${total}) — do not close this page.`, null);
    for(const k of state.kras){
      tick('targets');
      if(!k.recId){ const r = await addRecord(CONFIG.FORMS.kra, { KRA_Name:k.name.trim(), Description:k.description || '', Employee_Name:me.name, Quarter:q, Year_field1:y, Weightage:k.weightage }); k.recId = String(r.ID); saveDraft(); }
      for(const g of k.goals){
        tick('tasks');
        if(!g.recId){ const r = await addRecord(CONFIG.FORMS.goal, { Goal_Name:g.name.trim(), Description:g.name.trim(), KRA:k.recId, Weightage:g.weightage, Data_Source:'Manual' }); g.recId = String(r.ID); saveDraft(); }
      }
    }
    for(const a of state.attributes){
      tick('role attributes');
      if(!a.recId){ const r = await addRecord(CONFIG.FORMS.competency, { Attribute_Name:a.name.trim(), Weightage:a.weightage, Employee_Name1:me.name, Quarter:q, Year_field1:y }); a.recId = String(r.ID); saveDraft(); }
    }
    tick('review');
    if(!already.length){
      await addRecord(CONFIG.FORMS.review, { Employee_Lookup:me.ID, Status:CONFIG.STATUS.targetsSet, Appraiser_Name:val('appraiserName'),
        Department:me.department, Quarter:q, Year_field:y });
    }
    clearDraft();
    lock(false);
    await loadPeriod();
    setStatus('✅ Targets saved. Come back to this page for Step 2 — Self Rating.', true);
  }catch(err){
    console.error('TARGETS ERROR', err); lock(false);
    setStatus('❌ Save failed: ' + errText(err) + ' — click Submit Targets again (saved items are not duplicated).', false);
  }
}
function validateRating(){
  for(let i = 0; i < state.kras.length; i++) for(let j = 0; j < state.kras[i].goals.length; j++)
    if(!state.kras[i].goals[j].selfRating) return `Task ${i+1}.${j+1}: select your self rating.`;
  for(let i = 0; i < state.attributes.length; i++) if(!state.attributes[i].rating) return `Role Attribute ${i+1}: select a rating.`;
  if(!state.kras.length) return 'No targets found for this quarter.';
  return '';
}
/* STEP 2 → update Goal + Competency ratings, add Training_Need,
   then Review Status "Submitted for Approval" (done last). */
async function submitRating(){
  if(state.busy) return;
  const problem = validateRating(); if(problem){ setStatus('❌ ' + problem, false); return; }
  const me = state.me, q = state.quarter, y = state.year, s = computeScores();
  lock(true);
  try{
    const goals = state.kras.flatMap(k => k.goals), newTrain = state.training.filter(t => !t.recId && t.need.trim());
    const total = goals.length + state.attributes.length + newTrain.length + 1;
    let step = 0; const tick = w => setStatus(`Saving ${w}… (${++step}/${total}) — do not close this page.`, null);
    for(const g of goals){ tick('self ratings'); await updateRecord(CONFIG.REPORTS.goal, g.recId, { Achievement:g.achievement || '', Self_Rating:String(g.selfRating) }); }
    for(const a of state.attributes){ tick('role attributes'); await updateRecord(CONFIG.REPORTS.competency, a.recId, { Rating:String(a.rating) }); }
    for(const t of newTrain){
      tick('training needs');
      const r = await addRecord(CONFIG.FORMS.training, { Training_Need:t.need.trim(), Expected_Benefit:t.benefit || '', How_Fulfilled:t.fulfilled || '', Employee_Name:me.name, Quarter1:q, Year_field:y });
      t.recId = String(r.ID); saveDraft();
    }
    tick('review');
    const data = { Status:CONFIG.STATUS.selfRated, Appraiser_Name:val('appraiserName'),
      Facilitating_Factors1:state.texts.facFactors, Constraining_Factors:state.texts.conFactors, Outstanding_Achievement:state.texts.outAchieve,
      Appraiser_Comments:state.texts.apprComments, My_Learnings:state.texts.myLearnings, Overall_Rating:state.overallRating || '',
      KRA_Score:s.kra, Competency_Score:s.role, Final_Score:s.total };
    if(state.review) await updateRecord(CONFIG.REPORTS.review, state.review.ID, data);
    else await addRecord(CONFIG.FORMS.review, Object.assign({ Employee_Lookup:me.ID, Department:me.department, Quarter:q, Year_field:y }, data));
    clearDraft();
    lock(false);
    await loadPeriod();
    setStatus('✅ Self rating submitted. Download your PDF anytime.', true);
  }catch(err){
    console.error('RATING ERROR', err); lock(false);
    setStatus('❌ Save failed: ' + errText(err) + ' — your entries are kept, click Submit Self Rating again.', false);
  }
}

/* ======================= PDF ======================= */
function downloadPdf(){
  if(state.phase === 'loading'){ setStatus('Please wait — still loading.', null); return; }
  applyWeights();
  const sh = { kra:kraTotal(), role:roleTotal() };
  downloadAppraisalPdf({
    employeeName:state.me.name, department:state.me.department, appraiser:val('appraiserName'), year:state.year, quarter:state.quarter,
    kraSectionWeight:Math.round(sh.kra*100)/100 || 100, roleSectionWeight:Math.round(sh.role*100)/100, ratingMap:CONFIG.RATING_PCT,
    kras:state.kras.map(k => ({ name:k.name, description:k.description, weightage:k.weightage,
      goals:k.goals.filter(g => g.name || g.achievement).map(g => ({ name:g.name, achievement:g.achievement, weightage:g.weightage, selfRating:g.selfRating, apprRating:g.apprRating })) })),
    attributes:state.attributes.map(a => ({ name:a.name, weightage:a.weightage, rating:a.rating })),
    facilitating:state.texts.facFactors, constraining:state.texts.conFactors, outstanding:state.texts.outAchieve,
    comments:state.texts.apprComments, learnings:state.texts.myLearnings,
    training:state.training.map(t => ({ need:t.need, benefit:t.benefit, fulfilled:t.fulfilled })),
    overallRating:state.overallRating || ''
  }, setStatus);
}

/* ======================= UTIL ======================= */
function esc(s){ return (s === null || s === undefined ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ const x = Number(n) || 0; return (Math.round(x * 100) / 100).toString(); }

/* ======================= INIT ======================= */
window.addEventListener('beforeunload', () => saveDraft());
(async function init(){
  if(!(window.ZOHO && ZOHO.CREATOR)){ loginMsg('Zoho Creator SDK not found — open this page as a Creator widget.', false); return; }
  try{
    await ZOHO.CREATOR.init();
    state.creatorUser = await getCreatorUser();
    await loadEmployees();
    state.sdkReady = true;
    document.getElementById('loginBtn').disabled = false;
    loginMsg('', null);
    let saved = ''; try{ saved = sessionStorage.getItem('mega_pa_session') || ''; }catch(e){}
    const input = document.getElementById('loginEmail');
    input.value = saved || state.creatorUser || '';
    if(saved && state.employees.some(e => e.email === saved) && (!state.creatorUser || state.creatorUser === saved)) doLogin();
    else input.focus();
  }catch(err){
    console.error('INIT ERROR', err);
    loginMsg('Could not load the employee list: ' + errText(err) + '. Check CONFIG.EMPLOYEE_REPORTS and your permission on that report.', false);
  }
})();
